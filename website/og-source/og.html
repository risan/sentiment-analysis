<!doctype html>
<!--
  Source of public/og.png (1200x630). Run npm ci first (the fonts come from node_modules), then render it with:
  chrome-headless-shell --no-sandbox --hide-scrollbars --window-size=1200,630 \
    --screenshot=public/og.png file://$PWD/og-source/og.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Plex Sans';
        src: url('../node_modules/@fontsource-variable/ibm-plex-sans/files/ibm-plex-sans-latin-wght-normal.woff2');
        font-weight: 100 700;
      }
      @font-face {
        font-family: 'Plex Mono';
        src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Plex Mono';
        src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2');
        font-weight: 500;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 88px;
        font-family: 'Plex Sans', sans-serif;
        color: #18181b;
        background: #fff;
      }
      .brand {
        font-family: 'Plex Mono', monospace;
        font-weight: 500;
        font-size: 28px;
      }
      h1 {
        font-weight: 600;
        font-size: 80px;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }
      p {
        margin-top: 28px;
        max-width: 860px;
        font-size: 32px;
        line-height: 1.4;
        color: #52525b;
      }
      .install {
        align-self: flex-start;
        padding: 16px 24px;
        border: 2px solid #e4e4e7;
        background: #fafafa;
        font-family: 'Plex Mono', monospace;
        font-size: 28px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="brand">sentiment-analysis</div>
    <div>
      <h1>Sentiment analysis<br />for PHP</h1>
      <p>Scores English and Indonesian text as positive, negative or neutral. No API calls, no dependencies.</p>
    </div>
    <div class="install">composer require risan/sentiment-analysis</div>
  </body>
</html>
